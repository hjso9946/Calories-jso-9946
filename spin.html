<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0f1419"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>转盘</title>
<style>
.wheel-wrap{position:relative;width:min(280px,78vw);margin:8px auto 16px}
.wheel{width:100%;aspect-ratio:1;border-radius:50%;border:4px solid var(--line);position:relative;overflow:hidden;transition:transform 3.2s cubic-bezier(.15,.9,.2,1)}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--warn);z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.spin-result{text-align:center;font-size:20px;font-weight:700;min-height:32px;margin:8px 0 12px}
.opt-row{display:flex;gap:8px;margin-bottom:8px}
.opt-row input{flex:1}
.opt-row button{border:0;background:rgba(240,113,120,.15);color:var(--bad);border-radius:10px;padding:0 12px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div id="userBar"></div>
  <div id="navHost"></div>

  <div class="hero">
    <div class="date" id="spinWho">今天吃什么</div>
    <div class="total" style="font-size:32px">转盘随机选</div>
  </div>

  <div class="card">
    <h2>转盘</h2>
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="wheel" id="wheel"></div>
    </div>
    <div class="spin-result" id="spinResult">点下方按钮开始</div>
    <button class="btn" id="btnSpin">开始转</button>
  </div>

  <div class="card">
    <h2>选项（可编辑）</h2>
    <div id="optList"></div>
    <div class="opt-row" style="margin-top:8px">
      <input type="text" id="newOpt" placeholder="添加选项，如：麻辣烫"/>
      <button class="btn" id="btnAddOpt" style="width:auto;padding:12px 16px">加</button>
    </div>
    <p class="chart-note">选项按用户保存 · 食物库仍全局共享</p>
  </div>

  <div class="foot">数据存本机浏览器</div>
</div>
<script src="app.js"></script>
<script>
renderNav('spin.html');

const COLORS = ['#5b9dff','#7c6cff','#3dd68c','#f5a524','#f07178','#2dd4bf','#c084fc','#fb7185'];
let spinning = false;

function u() { return activeUser(); }

function getOpts() {
  const st = u();
  if (!Array.isArray(st.spin) || !st.spin.length) {
    st.spin = ['猪脚饭', '麦当劳双吉', '麻辣烫', '自选菜', '鸡胸肉沙拉', '寿司', '火鸡面', '黄焖鸡'];
    saveActiveUser(st);
  }
  return st.spin;
}

function setOpts(list) {
  const st = u();
  st.spin = list;
  saveActiveUser(st);
}

function drawWheel() {
  const opts = getOpts();
  const wheel = $('#wheel');
  const n = opts.length;
  if (!n) {
    wheel.style.background = '#222c38';
    wheel.innerHTML = '';
    return;
  }
  const seg = 360 / n;
  const stops = [];
  for (let i = 0; i < n; i++) {
    const a = i * seg;
    stops.push(COLORS[i % COLORS.length] + ' ' + a + 'deg ' + (a + seg) + 'deg');
  }
  wheel.style.background = 'conic-gradient(' + stops.join(',') + ')';
  // 文字放在每格正中：CSS rotate 与 conic 同为从顶部顺时针
  const R = Math.round((wheel.clientWidth || 260) * 0.32);
  wheel.innerHTML = opts.map((t, i) => {
    const mid = (i + 0.5) * seg;
    return '<div style="position:absolute;left:50%;top:50%;width:72px;margin-left:-36px;margin-top:-8px;' +
      'transform:rotate(' + mid + 'deg) translateY(-' + R + 'px);' +
      'transform-origin:36px 8px;' +
      'font-size:11px;font-weight:700;color:#fff;text-align:center;' +
      'text-shadow:0 1px 2px rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
      t + '</div>';
  }).join('');
}

function renderOpts() {
  const opts = getOpts();
  $('#optList').innerHTML = opts.map((t, i) => (
    '<div class="opt-row"><input type="text" data-i="' + i + '" value="' + String(t).replace(/"/g, '&quot;') + '"/>' +
    '<button data-del="' + i + '">×</button></div>'
  )).join('');
  $('#optList').querySelectorAll('input').forEach(inp => {
    inp.onchange = () => {
      const list = getOpts();
      list[+inp.dataset.i] = inp.value.trim() || list[+inp.dataset.i];
      setOpts(list);
      drawWheel();
    };
  });
  $('#optList').querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => {
      const list = getOpts();
      if (list.length <= 2) { toast('至少留 2 个选项'); return; }
      list.splice(+btn.dataset.del, 1);
      setOpts(list);
      renderOpts();
      drawWheel();
    };
  });
}

$('#btnAddOpt').onclick = () => {
  const v = $('#newOpt').value.trim();
  if (!v) return;
  const list = getOpts();
  if (list.indexOf(v) >= 0) { toast('已有这项'); return; }
  list.push(v);
  setOpts(list);
  $('#newOpt').value = '';
  renderOpts();
  drawWheel();
  toast('已添加');
};

let wheelAngle = 0;

$('#btnSpin').onclick = () => {
  if (spinning) return;
  const opts = getOpts();
  if (opts.length < 2) { toast('至少 2 个选项'); return; }
  spinning = true;
  $('#spinResult').textContent = '转动中…';
  const idx = Math.floor(Math.random() * opts.length);
  const seg = 360 / opts.length;
  // 指针在正上方。把 idx 格的中心转到正上方：
  // (idx+0.5)*seg + angle ≡ 0 (mod 360) → angle = 360k - (idx+0.5)*seg
  const base = Math.ceil(wheelAngle / 360) * 360 + 360 * 5;
  const target = base - (idx + 0.5) * seg;
  wheelAngle = target;
  const wheel = $('#wheel');
  wheel.style.transform = 'rotate(' + target + 'deg)';
  setTimeout(() => {
    spinning = false;
    $('#spinResult').textContent = '👉 ' + opts[idx];
  }, 3300);
};

function refreshAll() {
  $('#spinWho').textContent = u().name + ' · 今天吃什么';
  renderOpts();
  drawWheel();
  $('#spinResult').textContent = '点下方按钮开始';
  wheelAngle = 0;
  $('#wheel').style.transform = 'rotate(0deg)';
}

renderUserBar(refreshAll);
refreshAll();
startSyncLoop();
window.addEventListener('calorie-sync', refreshAll);
</script>
</body>
</html>
