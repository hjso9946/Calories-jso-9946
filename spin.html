<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0f1419"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>转盘</title>
<style>
.wheel-wrap{position:relative;width:min(280px,78vw);margin:8px auto 16px}
.wheel{width:100%;aspect-ratio:1;border-radius:50%;border:4px solid var(--line);position:relative;overflow:hidden;transition:transform 3.2s cubic-bezier(.15,.9,.2,1)}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--warn);z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.spin-result{text-align:center;font-size:20px;font-weight:700;min-height:32px;margin:8px 0 12px}
.opt-row{display:flex;gap:8px;margin-bottom:8px}
.opt-row input{flex:1}
.opt-row button{border:0;background:rgba(240,113,120,.15);color:var(--bad);border-radius:10px;padding:0 12px;font-size:18px;cursor:pointer}
.board-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.board-tab{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.board-tab.on{background:rgba(91,157,255,.18);border-color:#5b9dff;color:#5b9dff;font-weight:700}
.board-tab.add{border-style:dashed;opacity:.75}
.board-tools{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.board-tools input{flex:1}
.board-tools button{border:0;background:rgba(240,113,120,.15);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div id="userBar"></div>
  <div id="navHost"></div>

  <div class="hero">
    <div class="date" id="spinWho">今天吃什么</div>
    <div class="total" style="font-size:32px">转盘随机选</div>
  </div>

  <div class="card">
    <h2>转盘</h2>
    <div class="board-tabs" id="boardTabs"></div>
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="wheel" id="wheel"></div>
    </div>
    <div class="spin-result" id="spinResult">点下方按钮开始</div>
    <button class="btn" id="btnSpin">开始转</button>
  </div>

  <div class="card">
    <h2>选项（可编辑）</h2>
    <div class="board-tools">
      <input type="text" id="boardName" placeholder="转盘名称"/>
      <button id="btnRename">改名</button>
      <button id="btnDelBoard">删转盘</button>
    </div>
    <div id="optList"></div>
    <div class="opt-row" style="margin-top:8px">
      <input type="text" id="newOpt" placeholder="添加选项，如：麻辣烫"/>
      <button class="btn" id="btnAddOpt" style="width:auto;padding:12px 16px">加</button>
    </div>
    <p class="chart-note">转盘只存本机 · 不同步 · 可建多个</p>
  </div>

  <div class="foot">转盘选项仅本机</div>
</div>
<script src="app.js"></script>
<script>
renderNav('spin.html');

const COLORS = ['#5b9dff','#7c6cff','#3dd68c','#f5a524','#f07178','#2dd4bf','#c084fc','#fb7185'];
const LS_SPIN = 'calorie_spins_v1';
const DEFAULT_OPTS = ['猪脚饭', '麦当劳双吉', '麻辣烫', '自选菜', '鸡胸肉沙拉', '寿司', '火鸡面', '黄焖鸡'];
let spinning = false;
let wheelAngle = 0;

function u() { return activeUser(); }

function loadBoards() {
  let wrap = null;
  try { wrap = JSON.parse(localStorage.getItem(LS_SPIN) || 'null'); } catch (e) {}
  if (wrap && Array.isArray(wrap.boards) && wrap.boards.length) {
    if (!wrap.boards.some(b => b.id === wrap.activeId)) wrap.activeId = wrap.boards[0].id;
    return wrap;
  }
  wrap = {
    activeId: 's_default',
    boards: [{ id: 's_default', name: '今天吃什么', opts: DEFAULT_OPTS.slice() }]
  };
  saveBoards(wrap);
  return wrap;
}

function saveBoards(wrap) {
  try { localStorage.setItem(LS_SPIN, JSON.stringify(wrap)); } catch (e) {}
}

function activeBoard() {
  const w = loadBoards();
  return w.boards.find(b => b.id === w.activeId) || w.boards[0];
}

function setOpts(list) {
  const w = loadBoards();
  const b = w.boards.find(x => x.id === w.activeId) || w.boards[0];
  b.opts = list;
  saveBoards(w);
}

function getOpts() {
  return activeBoard().opts || [];
}

function drawWheel() {
  const opts = getOpts();
  const wheel = $('#wheel');
  const n = opts.length;
  if (!n) {
    wheel.style.background = '#222c38';
    wheel.innerHTML = '';
    return;
  }
  const seg = 360 / n;
  const stops = [];
  for (let i = 0; i < n; i++) {
    const a = i * seg;
    stops.push(COLORS[i % COLORS.length] + ' ' + a + 'deg ' + (a + seg) + 'deg');
  }
  wheel.style.background = 'conic-gradient(' + stops.join(',') + ')';
  const R = Math.round((wheel.clientWidth || 260) * 0.32);
  wheel.innerHTML = opts.map((t, i) => {
    const mid = (i + 0.5) * seg;
    return '<div style="position:absolute;left:50%;top:50%;width:72px;margin-left:-36px;margin-top:-8px;' +
      'transform:rotate(' + mid + 'deg) translateY(-' + R + 'px);' +
      'transform-origin:36px 8px;' +
      'font-size:11px;font-weight:700;color:#fff;text-align:center;' +
      'text-shadow:0 1px 2px rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
      t + '</div>';
  }).join('');
}

function renderTabs() {
  const w = loadBoards();
  $('#boardTabs').innerHTML = w.boards.map(b => (
    '<button class="board-tab' + (b.id === w.activeId ? ' on' : '') + '" data-b="' + b.id + '">' +
    String(b.name || '未命名').replace(/</g, '&lt;') + '</button>'
  )).join('') + '<button class="board-tab add" id="btnAddBoard">＋ 新转盘</button>';

  $('#boardTabs').querySelectorAll('[data-b]').forEach(btn => {
    btn.onclick = () => {
      w.activeId = btn.dataset.b;
      saveBoards(w);
      refreshAll();
    };
  });
  $('#btnAddBoard').onclick = () => {
    const name = prompt('新转盘名称', '转盘' + (w.boards.length + 1));
    if (name === null) return;
    const clean = name.trim() || ('转盘' + (w.boards.length + 1));
    const id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    w.boards.push({ id: id, name: clean, opts: DEFAULT_OPTS.slice() });
    w.activeId = id;
    saveBoards(w);
    refreshAll();
    toast('已新建');
  };
}

function renderOpts() {
  const opts = getOpts();
  const b = activeBoard();
  $('#boardName').value = b.name || '';
  $('#optList').innerHTML = opts.map((t, i) => (
    '<div class="opt-row"><input type="text" data-i="' + i + '" value="' + String(t).replace(/"/g, '&quot;') + '"/>' +
    '<button data-del="' + i + '">×</button></div>'
  )).join('');
  $('#optList').querySelectorAll('input').forEach(inp => {
    inp.onchange = () => {
      const list = getOpts();
      list[+inp.dataset.i] = inp.value.trim() || list[+inp.dataset.i];
      setOpts(list);
      drawWheel();
    };
  });
  $('#optList').querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => {
      const list = getOpts();
      if (list.length <= 2) { toast('至少留 2 个选项'); return; }
      list.splice(+btn.dataset.del, 1);
      setOpts(list);
      renderOpts();
      drawWheel();
    };
  });
}

$('#btnAddOpt').onclick = () => {
  const v = $('#newOpt').value.trim();
  if (!v) return;
  const list = getOpts();
  if (list.indexOf(v) >= 0) { toast('已有这项'); return; }
  list.push(v);
  setOpts(list);
  $('#newOpt').value = '';
  renderOpts();
  drawWheel();
  toast('已添加');
};

$('#btnRename').onclick = () => {
  const w = loadBoards();
  const b = w.boards.find(x => x.id === w.activeId) || w.boards[0];
  const name = $('#boardName').value.trim();
  if (!name) { toast('填名称'); return; }
  b.name = name;
  saveBoards(w);
  renderTabs();
  toast('已改名');
};

$('#btnDelBoard').onclick = () => {
  const w = loadBoards();
  if (w.boards.length <= 1) { toast('至少留 1 个转盘'); return; }
  const b = w.boards.find(x => x.id === w.activeId) || w.boards[0];
  if (!confirm('删除转盘「' + b.name + '」？')) return;
  w.boards = w.boards.filter(x => x.id !== b.id);
  w.activeId = w.boards[0].id;
  saveBoards(w);
  refreshAll();
  toast('已删除');
};

$('#btnSpin').onclick = () => {
  if (spinning) return;
  const opts = getOpts();
  if (opts.length < 2) { toast('至少 2 个选项'); return; }
  spinning = true;
  $('#spinResult').textContent = '转动中…';
  const idx = Math.floor(Math.random() * opts.length);
  const seg = 360 / opts.length;
  const base = Math.ceil(wheelAngle / 360) * 360 + 360 * 5;
  const target = base - (idx + 0.5) * seg;
  wheelAngle = target;
  const wheel = $('#wheel');
  wheel.style.transform = 'rotate(' + target + 'deg)';
  setTimeout(() => {
    spinning = false;
    $('#spinResult').textContent = '👉 ' + opts[idx];
  }, 3300);
};

function refreshAll() {
  $('#spinWho').textContent = u().name + ' · 今天吃什么';
  renderTabs();
  renderOpts();
  drawWheel();
  $('#spinResult').textContent = '点下方按钮开始';
  wheelAngle = 0;
  $('#wheel').style.transform = 'rotate(0deg)';
}

renderUserBar(refreshAll);
refreshAll();
// 转盘本机独立，云端同步不影响
</script>
</body>
</html>
